<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Choose an edition | EPIC CARD STUDIO</title>
  <meta name="theme-color" content="#07080a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>if(location.protocol==="file:"){document.addEventListener("DOMContentLoaded",function(){document.body.insertAdjacentHTML("afterbegin","<div class=\"file-warning\" role=\"alert\">This site uses ES modules and must be served over http. Run a local server (see README), do not open the file directly.</div>");});}</script>
</head>
<body data-page="editions" class="editions-page">
  <a class="back-link cut-box" href="index.html"><span aria-hidden="true">&#9664;</span> BACK</a>
  <main class="editions">
    <section class="panel panel-color" aria-labelledby="color-title">
      <div class="deco" aria-hidden="true">
        <svg viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice"><g fill="#fff" opacity=".07" id="rays"></g>
          <polygon points="60,120 220,60 260,200 120,260" fill="#22d3ee" opacity=".35"/>
          <polygon points="420,640 560,560 580,720 450,780" fill="#ff2ea6" opacity=".45"/>
          <polygon points="300,380 360,330 410,390 350,440" fill="#b8ff2c" opacity=".5"/>
          <circle cx="470" cy="190" r="70" fill="none" stroke="#7df3ff" stroke-width="3" opacity=".7"/>
          <circle cx="120" cy="700" r="46" fill="#ffe66d" opacity=".5"/>
        </svg>
        <span class="ghost">COLOR</span>
      </div>
      <div class="panel-inner">
        <h2 id="color-title" class="panel-title">COLOR REALM</h2>
        <p class="panel-copy">Full-colour card, front and back, in one A4 PDF.</p>
        <span class="glow glow-color"><button type="button" class="btn btn-color" data-edition="color"><span class="spin" aria-hidden="true"></span><span class="btn-label">DOWNLOAD COLOR PDF</span></button></span>
        <p class="status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section class="panel panel-manga" aria-labelledby="manga-title">
      <div class="deco" aria-hidden="true"><span class="speed"></span><span class="dots"></span><span class="ghost">MONO</span></div>
      <div class="panel-inner">
        <h2 id="manga-title" class="panel-title">MONO CHAPTER</h2>
        <p class="panel-copy">Black-and-white manga card, front and back, in one A4 PDF.</p>
        <span class="glow glow-manga"><button type="button" class="btn btn-manga" data-edition="manga"><span class="spin" aria-hidden="true"></span><span class="btn-label">DOWNLOAD MANGA PDF</span></button></span>
        <p class="status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script>
    (function(){var g=document.getElementById("rays"),s="";for(var i=0;i<30;i+=2){var a=i*Math.PI/15,b=(i+1)*Math.PI/15;s+='<polygon points="300,450 '+(300+1200*Math.cos(a)).toFixed(0)+','+(450+1200*Math.sin(a)).toFixed(0)+' '+(300+1200*Math.cos(b)).toFixed(0)+','+(450+1200*Math.sin(b)).toFixed(0)+'"/>';}g.innerHTML=s;})();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
