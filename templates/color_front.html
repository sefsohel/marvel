/* Card template. Design inside the fixed-size .card root (640 x 960 px).
   Keep it self-contained: inline SVG and data: URIs export most reliably.
   Avoid clip-path, filters and blend modes: the PDF renderer ignores them. */
html,body{margin:0;padding:0;background:#fff}
*{box-sizing:border-box}
.card{position:relative;width:640px;height:960px;overflow:hidden;font-family:'Rajdhani','Arial Narrow',Arial,sans-serif;background:#12062e;}
.card svg.art{position:absolute;left:0;top:0;width:640px;height:960px}
.t{position:absolute;margin:0}

.no{left:46px;top:42px;font-size:20px;font-weight:700;letter-spacing:4px;color:#b8ff2c}
.ed{right:46px;top:42px;font-size:20px;font-weight:700;letter-spacing:4px;color:#7df3ff;text-align:right}
.name{left:0;width:640px;top:640px;text-align:center;font-size:76px;line-height:.95;font-weight:700;letter-spacing:3px;color:#fff;text-shadow:0 0 18px rgba(255,46,166,.7)}
.sub{left:0;width:640px;top:735px;text-align:center;font-size:24px;font-weight:600;letter-spacing:5px;color:#e2c8ff}
.stat{width:160px;text-align:center;top:812px}
.stat b{display:block;font-size:48px;line-height:1;color:#fff}
.stat span{display:block;font-size:17px;font-weight:600;letter-spacing:4px;color:#b8ff2c}
.foot{left:0;width:640px;top:893px;text-align:center;font-size:16px;font-weight:600;letter-spacing:6px;color:#a687ff}

</style>
